name: PR Checks
on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  trunk-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

  changed-files:
    name: Determine Changed Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relNotes_any_changed: ${{ steps.changed-files.outputs.relNotes_any_changed }}
      relValidate_any_changed: ${{ steps.changed-files.outputs.relValidate_any_changed }}
      go_any_changed: ${{ steps.changed-files.outputs.go_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6        uses: tj-actions/changed-files@v47
        with:
          files_yaml_from_source_file: .github/changed-files.yml

  test-release-notes:
    name: Test Release Notes
    needs: changed-files
    if: needs.changed-files.outputs.relNotes_any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0

      - name: Install dependencies
        run: npm ci

      - name: Run release notes test
        run: npm run test:release-notes

  test-release-validate:
    name: Test Release Validate
    needs: changed-files
    if: needs.changed-files.outputs.relValidate_any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0

      - name: Install dependencies
        run: npm ci

      - name: Test valid PR with feat + fix
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "feat: test feature" true true

      - name: Test invalid title, valid commits
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "invalid title" true true

      - name: Test valid title, no commits
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.2.2 v1.2.2 "feat: test" true true

      - name: Test invalid title, no commits
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.2.2 v1.2.2 "invalid" true true || true

      - name: Test squash only allowed
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "feat: test" true false

      - name: Test rebase only allowed
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "invalid" false true

      - name: Test both false (should fail)
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "feat: test" false false || true

  test:
    name: Test Go Code
    needs: changed-files
    if: needs.changed-files.outputs.go_any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum

      - name: Go cache paths
        id: go-cache-paths
        run: |
          GOPATHBIN=$(go env GOPATH)/bin
          [ -d $GOPATHBIN ] && chmod -R 0755 $GOPATHBIN
          echo "go-tool=$GOPATHBIN" >> $GITHUB_OUTPUT

      - name: Install Go dependencies
        run: go mod download

      - name: Go Tool Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache-paths.outputs.go-tool }}
          key: ${{ runner.os }}-go-tools-${{ hashFiles('**/go.tools') }}

      - name: Install tools
        run: |
          for tool in $(cat go.tools); do
            go install "$tool"
          done

      - name: Run tests
        run: CC_THRESHOLD=10 ./scripts/test.sh

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: ./.coverage
          include-hidden-files: true

      - name: Get Riskover Metrics Output
        if: github.event_name == 'pull_request'
        id: riskover
        run: |
          {
            echo 'report<<EOF'
            cat ./.coverage/coverage-metrics.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Find Riskover Metrics Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: <!-- RISKOVER_METRICS -->

      - name: Create or update comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- RISKOVER_METRICS -->
            ${{ steps.riskover.outputs.report }}
          edit-mode: replace

  all_pr_checks:
    name: Passing PR Checks
    runs-on: ubuntu-latest
    if: always()
    needs: [trunk-check, test, test-release-notes, test-release-validate]
    steps:
      - name: Export needs results as JSON
        id: export-needs
        run: echo '${{ toJSON(needs) }}' > needs.json

      - name: Check if all jobs passed or were skipped
        run: |
          needs=$(cat needs.json)
          for job in $(echo "$needs" | jq -r 'keys[]'); do
            result=$(echo "$needs" | jq -r ".\"$job\".result")
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job $job failed."
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
        shell: bash
