# Reusable workflow: Update TOC Interface version(s)
#
# Checks for new WoW interface versions daily, updates the addon's .toc file,
# and creates a PR with the appropriate commit type (toc: for additions,
# chore: for removals).
#
# Inputs:
#   addon-name: The addon directory/name (e.g., "Endeavoring", "RPGLootFeed")
#   pr-body:    The PR body markdown (checklist of test requirements)
#
# Requires: GH_PAT secret (passed via `secrets: inherit`)

name: Update TOC Interface version(s)

on:
  workflow_call:
    inputs:
      addon-name:
        description: Addon directory name (e.g., Endeavoring, RPGLootFeed)
        required: true
        type: string
      pr-body:
        description: PR body markdown with test checklist
        required: true
        type: string
      beta:
        description: Include beta versions in the TOC update
        required: false
        type: boolean
        default: true
      ptr:
        description: Include PTR versions in the TOC update
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Clone project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update TOC Interface version
        id: update-toc
        # trunk-ignore(pinact/unpinned-action)
        uses: McTalian-WoW-Addons/wow-build-tools/toc/update@v1
        with:
          addon-dir: ${{ inputs.addon-name }}
          beta: ${{ inputs.beta }}
          ptr: ${{ inputs.ptr }}

      - name: Detect change type
        id: change-type
        run: |
          VERSIONS_ADDED=${{ steps.update-toc.outputs.versions-added }}
          VERSIONS_REMOVED=${{ steps.update-toc.outputs.versions-removed }}

          if [ "$VERSIONS_ADDED" -gt 0 ]; then
            echo "pr_title=toc: bump versions, please submit any bugs" >> $GITHUB_OUTPUT
            echo "commit_message=toc: bump versions, please submit any bugs" >> $GITHUB_OUTPUT
            echo "Detected version additions (toc commit): $VERSIONS_ADDED added, $VERSIONS_REMOVED removed"
          elif [ "$VERSIONS_REMOVED" -gt 0 ]; then
            echo "pr_title=chore: remove old interface versions" >> $GITHUB_OUTPUT
            echo "commit_message=chore: remove old interface versions" >> $GITHUB_OUTPUT
            echo "Detected only version removals (chore commit): $VERSIONS_REMOVED removed"
          else
            echo "pr_title=chore: no version changes" >> $GITHUB_OUTPUT
            echo "commit_message=chore: no version changes" >> $GITHUB_OUTPUT
            echo "No version changes detected"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT }}
          title: ${{ steps.change-type.outputs.pr_title }}
          body: ${{ inputs.pr-body }}
          commit-message: ${{ steps.change-type.outputs.commit_message }}
          branch: interface-version
          delete-branch: true
