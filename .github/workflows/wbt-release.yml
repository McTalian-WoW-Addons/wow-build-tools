name: Release
on:
  workflow_call:
    secrets:
      TOC_APP_ID:
        required: true
      TOC_APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  release:
    name: Build Binary and Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.TOC_APP_ID }}
          private-key: ${{ secrets.TOC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Go dependencies
        run: go mod download

      - name: Build dist
        run: |
          mkdir -p dist
          go build -o dist/wow-build-tools

      - name: Smoke test built binary
        run: |
          ./dist/wow-build-tools --help

      - name: Setup Node.js
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0

      - name: Install Node dependencies
        run: npm install

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release
