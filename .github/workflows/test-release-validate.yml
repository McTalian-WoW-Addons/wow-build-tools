name: Test Release Validate Script
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/release-validate.mjs
      - .releaserc.json
      - package.json
  push:
    branches: [main]
    paths:
      - .github/scripts/release-validate.mjs
      - .releaserc.json
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-release-validate:
    name: Test release-validate.mjs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0        uses: volta-cli/action@v5

      - name: Install dependencies
        run: npm ci

      - name: Test valid PR with feat + fix
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "feat: test feature" true true

      - name: Test invalid title, valid commits
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "invalid title" true true

      - name: Test valid title, no commits
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.2.2 v1.2.2 "feat: test" true true

      - name: Test invalid title, no commits
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.2.2 v1.2.2 "invalid" true true || true

      - name: Test squash only allowed
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "feat: test" true false

      - name: Test rebase only allowed
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "invalid" false true

      - name: Test both false (should fail)
        run: |
          node .github/scripts/release-validate.mjs validate-pr v1.1.1 v1.2.0 "feat: test" false false || true
